laravel: '@testbench'

env:
  - APP_URL="http://127.0.0.1:8000"

providers:
  - Fina\StructuredContent\BlocksServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - database/migrations
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - storage-link
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
